# 只开「真问题」规则。风格类全关，避免一上来几百条噪音把 lint 变成摆设。
excluded:
  - JianRiJi.xcodeproj
  - .build
  - tools

disabled_rules:
  - todo
  - trailing_whitespace
  - identifier_name
  - type_name
  - nesting
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - multiple_closures_with_trailing_closure
  - notification_center_detachment
  - non_optional_string_data_conversion
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - redundant_nil_coalescing
  - toggle_bool
  - unused_import
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

# 关掉会误伤 SwiftUI 链式调用的一项。
trailing_closure:
  only_single_muted_parameter: true
