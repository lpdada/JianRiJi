name: JianRiJi
options:
  bundleIdPrefix: com.lpdada
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  JianRiJi:
    type: application
    platform: iOS
    sources:
      - path: JianRiJi
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: JianRiJi
        PRODUCT_BUNDLE_IDENTIFIER: com.lpdada.jianriji
        INFOPLIST_FILE: JianRiJi/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  JianRiJiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lpdada.jianriji.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JianRiJi

schemes:
  JianRiJi:
    build:
      targets:
        JianRiJi: all
        JianRiJiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - JianRiJiTests
