name: JianRiJi
options:
  bundleIdPrefix: com.lpdada
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 让空的 Features/ 子目录也能进工程，重命名目录时不会丢 group。
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Automatic
    # 原来是最宽松的 minimal，等于关闭了跨 actor 的可变状态检查。
    # targeted 足以抓出「非 MainActor 类里改共享状态」这类问题（Speech / SpeechLoop 就是这么漏掉的），
    # 升到 complete 需要把音频层的 delegate 回调一并迁移，留作下一步。
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    # 编译期点名「类型检查过慢的表达式」和「过长函数」——它们通常是编译时间失控的元凶。
    # Swift 6 的 driver 不再直接认这两个 flag（报 unknown argument），必须经 -Xfrontend 传给前端。
    OTHER_SWIFT_FLAGS:
      - $(inherited)
      - -Xfrontend
      - -warn-long-expression-type-checking
      - -Xfrontend
      - "200"
      - -Xfrontend
      - -warn-long-function-bodies
      - -Xfrontend
      - "200"

targets:
  JianRiJi:
    type: application
    platform: iOS
    sources:
      - path: JianRiJi
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: JianRiJi
        PRODUCT_BUNDLE_IDENTIFIER: com.lpdada.jianriji
        INFOPLIST_FILE: JianRiJi/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # 存档、语音包、缓存都在 Application Support / Caches 下，不需要 iCloud 容器。
        ENABLE_ONLY_ACTIVE_ARCH: NO
      configs:
        Debug:
          SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        # Release 把警告当错误：CI 绿着但满屏 warning 的工程算不上可交付。
        Release:
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

  JianRiJiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lpdada.jianriji.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JianRiJi

schemes:
  JianRiJi:
    build:
      targets:
        JianRiJi: all
        JianRiJiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # 覆盖率必须开：持久化、SRS、语音包格式这几块没有覆盖率就等于没测。
      gatherCoverageData: true
      coverageTargets:
        - JianRiJi
      targets:
        - JianRiJiTests
    analyze:
      config: Debug
